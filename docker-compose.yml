version: "3.8"

services:
  dinner-decider:
    image: ghcr.io/rmbassi2/mealplan:latest
    container_name: dinner-decider
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT:-8000}:8000"
    volumes:
      # Named volume preserves SQLite database across image pulls and avoids host permission issues:
      - dinner_decider_data:/app/data
      # Or use a host bind mount if preferred (ensure UID 10001 has write access: sudo chown -R 10001:10001 ./data):
      # - ./data:/app/data
    environment:
      - PORT=8000
      - MEALIE_BASE_URL=${MEALIE_BASE_URL:-}
      - MEALIE_API_TOKEN=${MEALIE_API_TOKEN:-}
      - MEALIE_GROUP_SLUG=${MEALIE_GROUP_SLUG:-home}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_BASE_URL=${NTFY_BASE_URL:-https://ntfy.sh}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - MOCK_MODE=${MOCK_MODE:-false}
      - PANTRY_DB_PATH=${PANTRY_DB_PATH:-/app/data/pantry.db}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  dinner_decider_data:
